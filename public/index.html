<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giraso QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="page">
        <header class="brand">
            <a class="logo" href="https://giraso.bi/" target="_blank" rel="noopener">Giraso</a>
            <h1>QR</h1>
            <p>Make a code, download it, share it. Nothing is stored.</p>
        </header>

        <main class="panel">
            <form id="qrForm">
                <div class="form-group">
                    <span class="field-label" id="typeLabel">Content type</span>
                    <div class="segmented" role="radiogroup" aria-labelledby="typeLabel">
                        <label class="segment">
                            <input type="radio" name="type" value="url" checked>
                            <span>Link</span>
                        </label>
                        <label class="segment">
                            <input type="radio" name="type" value="text">
                            <span>Text</span>
                        </label>
                        <label class="segment">
                            <input type="radio" name="type" value="json">
                            <span>JSON</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="content">Your content</label>
                    <textarea
                        id="content"
                        name="content"
                        rows="4"
                        placeholder="https://example.com"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <span class="field-label">Center icon <span class="optional">(optional)</span></span>
                    <input
                        type="file"
                        id="icon"
                        name="icon"
                        class="sr-only"
                        accept=".png,.webp,.svg,image/png,image/webp,image/svg+xml"
                    >
                    <div
                        id="dropzone"
                        class="dropzone"
                        role="button"
                        tabindex="0"
                        aria-controls="icon"
                        aria-label="Add center icon"
                    >
                        <div id="dropEmpty" class="dropzone-empty">
                            <span class="dropzone-icon" aria-hidden="true">+</span>
                            <strong>Drop an image, or click to browse</strong>
                            <small>PNG, WebP or SVG · max 3 MB</small>
                        </div>
                        <div id="dropPreview" class="dropzone-preview" hidden>
                            <img id="iconPreview" alt="Selected icon preview">
                            <div class="dropzone-meta">
                                <strong id="iconName"></strong>
                                <small>Click to replace</small>
                            </div>
                            <button type="button" id="clearIcon" class="ghost-btn" aria-label="Remove icon">Remove</button>
                        </div>
                    </div>
                </div>

                <button type="submit" id="generateBtn">Generate</button>
                <p id="status" role="status"></p>
            </form>

            <section id="result" hidden>
                <img id="qrPreview" alt="Generated QR code">
                <a id="downloadBtn" download="giraso-qr.jpg">Download JPEG</a>
            </section>
        </main>

        <footer>
            <a href="https://giraso.bi/">giraso.bi</a>
        </footer>
    </div>

    <script src="/app.js"></script>
</body>
</html>
